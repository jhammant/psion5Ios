name: Psion5
options:
  bundleIdPrefix: io.hammant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 9HPLKKTW4L
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Psion5:
    type: application
    platform: iOS
    sources:
      - path: Psion5
        excludes:
          - Web
      - path: Psion5/Web
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Check WindEmu files
        basedOnDependencyAnalysis: false
        script: |
          for f in WindEmu.js WindEmu.wasm WindEmu.data cover.svg; do
            if [ ! -s "$SRCROOT/Psion5/Web/$f" ]; then
              echo "error: Psion5/Web/$f is missing. Run 'make setup' (scripts/fetch-windemu.sh) first."
              exit 1
            fi
          done
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.hammant.psion5
        PRODUCT_NAME: Psion5
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Psion5/Info.plist
      properties:
        CFBundleDisplayName: Psion 5mx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        ITSAppUsesNonExemptEncryption: false
        # Lets debug builds talk to scripts/mock-claude.py on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
